name: Development governance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  check:
    name: Development governance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify the governing document and pull request record
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          import os
          import re
          from subprocess import check_output

          path = "docs/development/au_ree_development_governance_v3.0.txt"
          expected = "07bbced85ec7070021838573572f10d0ec039d8b3420908396e709e54f3523dc"

          def blob(name):
              return check_output(["git", "show", f"HEAD:{name}"])

          if sha256(blob(path)).hexdigest() != expected:
              raise SystemExit("The versioned governance document differs from the approved original.")
          for document in ("AGENTS.md", "README.md", ".github/pull_request_template.md"):
              if path.encode() not in blob(document):
                  raise SystemExit(f"{document} must refer to the governing document.")

          body = re.sub(r"<!--.*?-->", "", os.environ["PR_BODY"], flags=re.DOTALL)
          lines = [line.strip() for line in body.splitlines()]
          if not any(re.fullmatch(r"Risk:[ \t]*(low|medium|high|highest)", line) for line in lines):
              raise SystemExit("Complete 'Risk:' with low, medium, high, or highest.")
          if not any(re.fullmatch(r"Verification:[ \t]*\S.*", line) for line in lines):
              raise SystemExit("Complete 'Verification:' with the actual results or limitations.")
          PY
