name: Migration verification

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "config/**"
      - "docs/migration/*.csv"
      - "pyproject.toml"
      - ".github/workflows/migration.yml"
  workflow_dispatch:
    inputs:
      fresh_release:
        type: boolean
        description: Verify a real fresh-source archive and cold replay
        default: false

permissions:
  contents: read

jobs:
  static-and-unit:
    name: Static and unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: python -m compileall -q src tests tools
      - run: python -m au_ree_v3 migration --help
      - run: python -m unittest discover -s tests -v

  frozen-reference:
    name: Frozen reference integrity
    if: github.event_name == 'workflow_dispatch' && !inputs.fresh_release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Fetch only the fixed V2 commits
        run: |
          git init "$RUNNER_TEMP/au-ree-v2"
          git -C "$RUNNER_TEMP/au-ree-v2" fetch --depth=1 --no-tags https://github.com/lleeoo0611-stack/AU_REE_V2.git \
            2af6f611e51eb4ac9dda73419d1afeba70d1307e \
            0dff6beb5aca52e565c37289e3ab295737e76942 \
            dcda87e81e1250d443f73c1984faaa7beaa19930
      - name: Rehash both archived profiles
        run: |
          for profile in archived-census-2026-11-13 phase22-2026-11-05; do
            au-ree-v3 migration verify-baseline --v2-root "$RUNNER_TEMP/au-ree-v2" \
              --profile "$profile" --out "work/migration/$profile"
            python - "$profile" <<'PY'
          import json
          import sys
          from pathlib import Path
          receipt = json.loads((Path("work/migration") / sys.argv[1] / "baseline_verification.json").read_text())
          print("Exact-source replay", receipt["source_to_output_replay"])
          print("Source availability", receipt["asset_inventory_counts"])
          PY
          done
      - name: Audit frozen Golden temporal evidence
        run: |
          au-ree-v3 migration audit-temporal --v2-root "$RUNNER_TEMP/au-ree-v2" \
            --expected tests/golden/golden_expected.jsonl --oracle-manifest tests/golden/oracle_manifest.json \
            --out work/migration/temporal
          cmp work/migration/temporal/temporal_audit.json docs/migration/temporal/temporal_audit.json
          cmp work/migration/temporal/temporal_dispositions.jsonl docs/migration/temporal/temporal_dispositions.jsonl

  resource-integration:
    name: Exact resource integration
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Locate the PDF parser
        run: |
          if ! command -v pdftotext; then
            sudo apt-get update
            sudo apt-get install --yes poppler-utils
          fi
          pdftotext -v
      - name: Verify and exercise the frozen PDF fixture
        run: |
          sha=fe26ac29c4773a5af95e909a1cd95ca1e9ad37c34560dfa72c1e9674e4c8a503
          directory="$RUNNER_TEMP/resource-fixture/assets"
          mkdir -p "$directory"
          curl --fail --location --retry 2 --max-time 40 \
            https://wcsecure.weblink.com.au/pdf/LYC/02835257.pdf --output "$directory/$sha"
          printf '%s  %s\n' "$sha" "$directory/$sha" | sha256sum --check
          export AU_REE_REPLAY_ASSETS="$directory"
          python -m unittest discover -s tests -p 'test_pipeline.py' -v
      - name: Verify the fresh resource layouts with exact source editions
        run: |
          directory="$RUNNER_TEMP/resource-fixture/assets"
          get_fixture() {
            url="$1"
            sha="$2"
            curl --fail --location --retry 2 --max-time 45 "$url" --output "$directory/$sha"
            printf '%s  %s\n' "$sha" "$directory/$sha" | sha256sum --check
          }
          get_fixture 'https://announcements.asx.com.au/asxpdf/20250116/pdf/06dl60mwyl4f8n.pdf' e29ab1305c8edb5bd1074806d5cf31c323c82cfd68c5c5b2e9b545137f09ccb0
          get_fixture 'https://hermes-cdn.investorhub.com/announcement-pdfs/asx/5449464.pdf?v=63941956896' eb484b6f7118d7319173b4f3637b2b66e9058abdf69bf6d5cc1cf358306190e5
          AU_REE_FRESH_ASSETS="$directory" python -m unittest discover -s tests -p 'test_fresh_observations.py' -v
          get_fixture 'https://hermes-cdn.investorhub.com/announcement-pdfs/lse/7804646.pdf?v=63960217384' 89467aedb62238c6a98902633fba1bcaf4ccd0f081beaa736facf71533ac3864
          get_fixture 'https://announcements.asx.com.au/asxpdf/20251015/pdf/06qkvvhp20rxx2.pdf' 5f8f642b6c9b561ca0f397fee0990e52786d85af3e67d53756def87b5cde2cd0
          get_fixture 'https://hermes-cdn.investorhub.com/announcement-pdfs/asx/7763164.pdf?v=63957978608' a861c5b1088895ecd45210d6d7d3e3a319deee81dd85853ebdc184fd4c1b8acb
          AU_REE_RESOURCE_YIELD_ASSETS="$directory" python -m unittest discover -s tests -p 'test_resource_yield.py' -v
          AU_REE_FRESH_ASSETS="$directory" python -m unittest discover -s tests -p 'test_composition_extraction.py' -v
      - name: Verify native technical measurement and process anchors
        run: |
          source="$RUNNER_TEMP/resource-fixture/wolverine-dfs.pdf"
          sha=5aad631c770a3a73dc1ff86e1bd3ae97f6972700f9ca9ca018dae65895fc8075
          curl --fail --location --retry 2 --max-time 45 \
            https://announcements.asx.com.au/asxpdf/20250915/pdf/06p6zt0hxtpg01.pdf --output "$source"
          printf '%s  %s\n' "$sha" "$source" | sha256sum --check
          AU_REE_TECHNICAL_NATIVE_PDF="$source" python -m unittest discover -s tests -p 'test_technical_processing.py' -v
      - name: Verify native geographic feature evidence
        run: |
          if ! command -v ogrinfo || ! command -v ogr2ogr; then
            sudo apt-get update
            sudo apt-get install --yes gdal-bin
          fi
          python -m unittest discover -s tests -p 'test_geography.py' -v
      - name: Restore a fresh release from its verified local copy
        if: github.event_name == 'workflow_dispatch' && inputs.fresh_release
        run: |
          AU_REE_FRESH_ASSETS="$RUNNER_TEMP/resource-fixture/assets" \
            python -m unittest discover -s tests -p 'test_publication.py' -v
