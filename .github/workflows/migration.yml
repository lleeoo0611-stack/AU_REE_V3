name: Migration verification

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "config/**"
      - "docs/migration/*.csv"
      - "pyproject.toml"
      - ".github/workflows/migration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-unit:
    name: Static and unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: python -m compileall -q src tests
      - run: python -m au_ree_v3 migration --help
      - run: python -m unittest discover -s tests -v

  frozen-reference:
    name: Frozen reference integrity
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Fetch only the fixed V2 commits
        run: |
          git init "$RUNNER_TEMP/au-ree-v2"
          git -C "$RUNNER_TEMP/au-ree-v2" fetch --depth=1 --no-tags https://github.com/lleeoo0611-stack/AU_REE_V2.git \
            2af6f611e51eb4ac9dda73419d1afeba70d1307e \
            0dff6beb5aca52e565c37289e3ab295737e76942 \
            dcda87e81e1250d443f73c1984faaa7beaa19930
      - name: Recover exact archived configuration
        run: |
          mkdir -p work/migration
          python tools/recover_archive_configuration.py --v2-root "$RUNNER_TEMP/au-ree-v2" \
            --out "$RUNNER_TEMP/archive-configuration" > work/migration/archive-configuration.json
      - name: Rehash both archived profiles
        run: |
          for profile in archived-census-2026-11-13 phase22-2026-11-05; do
            au-ree-v3 migration verify-baseline --v2-root "$RUNNER_TEMP/au-ree-v2" \
              --profile "$profile" --assets "$RUNNER_TEMP/archive-configuration" --out "work/migration/$profile"
            python - "$profile" <<'PY'
          import json
          import sys
          from pathlib import Path
          receipt = json.loads((Path("work/migration") / sys.argv[1] / "baseline_verification.json").read_text())
          print("Exact-source replay", receipt["source_to_output_replay"])
          print("Source availability", receipt["asset_inventory_counts"])
          PY
          done
      - name: Verify frozen point and sensitivity results
        run: |
          au-ree-v3 migration verify-mcda --v2-root "$RUNNER_TEMP/au-ree-v2" --out work/migration/point-mcda
          au-ree-v3 migration verify-sensitivity --v2-root "$RUNNER_TEMP/au-ree-v2" --out work/migration/leave-out

  resource-integration:
    name: Exact resource integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Locate the PDF parser
        run: |
          if ! command -v pdftotext; then
            sudo apt-get update
            sudo apt-get install --yes poppler-utils
          fi
          pdftotext -v
      - name: Verify and exercise the frozen PDF fixture
        run: |
          sha=fe26ac29c4773a5af95e909a1cd95ca1e9ad37c34560dfa72c1e9674e4c8a503
          directory="$RUNNER_TEMP/resource-fixture/assets"
          mkdir -p "$directory"
          curl --fail --location --retry 2 --max-time 40 \
            https://wcsecure.weblink.com.au/pdf/LYC/02835257.pdf --output "$directory/$sha"
          printf '%s  %s\n' "$sha" "$directory/$sha" | sha256sum --check
          export AU_REE_REPLAY_ASSETS="$directory"
          python -m unittest discover -s tests -p 'test_pipeline.py' -v
